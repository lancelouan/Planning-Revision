<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">

<title>Planning Révision</title>

<link rel="manifest" href="/Planning-Revision/manifest.json">

<style>
/* ============================================================
   PLANNING RÉVISION — INTERFACE
   ============================================================ */

:root{
  --bg:#f4f5f7;
  --card:#ffffff;
  --text:#171717;
  --muted:#6b7280;
  --border:#e5e7eb;
  --accent:#111111;
  --accent-soft:#f0f0f0;
  --danger:#dc2626;
  --success:#16a34a;
  --warning:#d97706;
  --shadow:0 8px 25px rgba(0,0,0,.07);
  --radius:16px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    "IBM Plex Sans",
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(1500px, calc(100% - 28px));
  margin:0 auto;
  padding:20px 0 50px;
}

header{
  margin-bottom:20px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-icon{
  width:46px;
  height:46px;
  border-radius:14px;
  background:var(--accent);
  color:white;
  display:grid;
  place-items:center;
  font-size:22px;
  font-weight:700;
}

.brand h1{
  margin:0;
  font-size:24px;
}

.brand p{
  margin:3px 0 0;
  color:var(--muted);
  font-size:13px;
}

.top-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:10px;
  padding:9px 13px;
  font-weight:600;
}

.btn:hover{
  background:var(--accent-soft);
}

.btn.primary{
  background:var(--accent);
  color:white;
  border-color:var(--accent);
}

.btn.danger{
  color:var(--danger);
}

.btn.success{
  color:var(--success);
}

.btn.small{
  padding:6px 9px;
  font-size:12px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
  margin-bottom:18px;
}

.card h2{
  margin:0 0 6px;
  font-size:19px;
}

.card h3{
  margin:0 0 5px;
}

.hint{
  color:var(--muted);
  font-size:13px;
  margin:0 0 15px;
}

.grid2{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:18px;
}

.form-row{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-bottom:10px;
}

.form-row.three{
  grid-template-columns:repeat(3,minmax(0,1fr));
}

.field{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.field label{
  font-size:12px;
  font-weight:700;
  color:var(--muted);
}

input,
select,
textarea{
  width:100%;
  border:1px solid var(--border);
  background:white;
  border-radius:9px;
  padding:9px 10px;
  color:var(--text);
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#888;
}

textarea{
  resize:vertical;
  min-height:70px;
}

.section-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

/* ============================================================
   ACCUEIL
   ============================================================ */

.greeting{
  background:var(--accent);
  color:white;
  border-radius:var(--radius);
  padding:22px;
  margin-bottom:18px;
}

.greeting h2{
  margin:0 0 5px;
}

.greeting p{
  margin:0;
  opacity:.75;
}

.quote{
  font-family:Georgia,serif;
  font-size:16px;
  line-height:1.5;
}

.quote-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:12px;
}

.quote-refresh{
  border:0;
  background:transparent;
  color:inherit;
  opacity:.7;
}

/* ============================================================
   MATIÈRES / COURS
   ============================================================ */

.subject-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.subject{
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
}

.subject-header{
  width:100%;
  border:0;
  background:white;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  text-align:left;
}

.subject-header:hover{
  background:#fafafa;
}

.subject-left{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.subject-dot{
  width:12px;
  height:12px;
  border-radius:50%;
  flex:none;
}

.subject-name{
  font-weight:800;
}

.subject-count{
  color:var(--muted);
  font-size:12px;
}

.subject-chevron{
  color:var(--muted);
  transition:.2s;
}

.subject.open .subject-chevron{
  transform:rotate(180deg);
}

.subject-content{
  display:none;
  border-top:1px solid var(--border);
  padding:14px;
  background:#fcfcfc;
}

.subject.open .subject-content{
  display:block;
}

.course-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.course{
  background:white;
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}

.course-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  padding:13px;
}

.course-title{
  font-weight:800;
}

.course-meta{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.chapter-list{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:8px;
}

.chapter-tag{
  padding:4px 7px;
  border-radius:7px;
  background:#f0f0f0;
  font-size:11px;
}

.course-progress{
  padding:0 13px 13px;
}

.progress-bar{
  height:7px;
  background:#eeeeee;
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  background:var(--accent);
  border-radius:20px;
}

.progress-text{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.empty{
  color:var(--muted);
  text-align:center;
  padding:25px 10px;
  font-size:13px;
}

/* ============================================================
   SUIVI
   ============================================================ */

.tracking-subject{
  border:1px solid var(--border);
  border-radius:14px;
  margin-bottom:12px;
  overflow:hidden;
}

.tracking-subject > summary{
  cursor:pointer;
  list-style:none;
  padding:14px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:10px;
}

.tracking-subject > summary::-webkit-details-marker{
  display:none;
}

.tracking-course{
  border-top:1px solid var(--border);
  padding:14px;
}

.tracking-course-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  margin-bottom:10px;
}

.tracking-course-title{
  font-weight:800;
}

.tracking-course-chapters{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.tracking-table-wrap{
  overflow-x:auto;
}

.tracking-table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

.tracking-table th{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  text-align:left;
  padding:8px;
  border-bottom:1px solid var(--border);
}

.tracking-table td{
  padding:8px;
  border-bottom:1px solid #eeeeee;
  vertical-align:middle;
  font-size:13px;
}

.tracking-table input,
.tracking-table select{
  padding:6px;
  font-size:12px;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 7px;
  border-radius:7px;
  font-size:11px;
  font-weight:700;
}

.status.done{
  background:#dcfce7;
  color:#166534;
}

.status.planned{
  background:#f3f4f6;
  color:#374151;
}

.status.late{
  background:#fef3c7;
  color:#92400e;
}

.mastery{
  display:flex;
  gap:3px;
}

.mastery-dot{
  width:14px;
  height:14px;
  border-radius:50%;
  border:1px solid #bbb;
  background:white;
  cursor:pointer;
}

.mastery-dot.active{
  background:var(--accent);
  border-color:var(--accent);
}

.revision-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

/* ============================================================
   SUGGESTIONS
   ============================================================ */

.suggestion{
  border:1px solid #f1d58a;
  background:#fffaf0;
  border-radius:12px;
  padding:12px;
  margin-bottom:8px;
}

.suggestion:last-child{
  margin-bottom:0;
}

.suggestion-main{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}

.suggestion-title{
  font-weight:800;
}

.suggestion-meta{
  color:#8a6a20;
  font-size:12px;
  margin-top:3px;
}

.suggestion-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin-top:9px;
}

/* ============================================================
   CALENDRIER
   ============================================================ */

.week-nav{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
}

.navbtn{
  width:36px;
  height:36px;
  border:1px solid var(--border);
  background:white;
  border-radius:9px;
}

.week-label{
  font-weight:800;
  flex:1;
  text-align:center;
}

.today-btn{
  border:1px solid var(--border);
  background:white;
  border-radius:9px;
  padding:8px 11px;
  font-size:12px;
  font-weight:700;
}

.day-picker{
  display:flex;
  gap:5px;
  overflow:auto;
  margin-bottom:10px;
}

.day-picker button{
  flex:1;
  min-width:75px;
  border:1px solid var(--border);
  background:white;
  border-radius:9px;
  padding:7px;
  font-size:12px;
}

.day-picker button.active{
  background:var(--accent);
  color:white;
}

.calendar-scroll{
  overflow-x:auto;
  border:1px solid var(--border);
  border-radius:12px;
}

.cal-wrap{
  display:grid;
  grid-template-columns:62px repeat(7,minmax(130px,1fr));
  min-width:980px;
}

.time-gutter{
  background:#fafafa;
  border-right:1px solid var(--border);
}

.time-label{
  height:60px;
  border-bottom:1px solid #eeeeee;
  font-size:10px;
  color:var(--muted);
  padding:5px;
  text-align:right;
}

.cal-days{
  display:contents;
}

.day-col{
  border-right:1px solid var(--border);
}

.day-header{
  height:48px;
  padding:8px;
  border-bottom:1px solid var(--border);
  background:#fafafa;
  font-size:12px;
  font-weight:800;
  text-align:center;
}

.day-body{
  position:relative;
  height:1440px;
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 29px,
      #eeeeee 30px,
      transparent 31px,
      transparent 59px,
      #e3e3e3 60px
    );
}

.cal-block{
  position:absolute;
  left:4px;
  right:4px;
  border-radius:8px;
  padding:6px;
  overflow:hidden;
  cursor:grab;
  user-select:none;
  border:1px solid rgba(0,0,0,.08);
  font-size:11px;
  z-index:3;
}

.cal-block:active{
  cursor:grabbing;
}

.cal-block.done{
  opacity:.55;
}

.cal-block-title{
  font-weight:800;
}

.cal-block-sub{
  opacity:.75;
  margin-top:2px;
}

.cal-block-duration{
  opacity:.65;
  margin-top:3px;
}

.drop-target{
  outline:2px dashed #777;
  outline-offset:-3px;
}

/* ============================================================
   TODO
   ============================================================ */

.todo-grid{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:8px;
}

.todo-day{
  border:1px solid var(--border);
  border-radius:11px;
  padding:9px;
  min-height:150px;
}

.todo-day-title{
  font-size:12px;
  font-weight:800;
  margin-bottom:7px;
}

.todo-items{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.todo-item{
  display:flex;
  align-items:flex-start;
  gap:6px;
  font-size:12px;
}

.todo-item.done span{
  text-decoration:line-through;
  color:var(--muted);
}

.todo-delete{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:0;
  margin-left:auto;
}

.todo-add{
  display:flex;
  gap:5px;
  margin-top:8px;
}

.todo-add input{
  min-width:0;
  padding:6px;
}

/* ============================================================
   STATS
   ============================================================ */

.stats-cards{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  margin-bottom:18px;
}

.stat{
  border:1px solid var(--border);
  border-radius:12px;
  padding:13px;
}

.stat-label{
  color:var(--muted);
  font-size:11px;
}

.stat-value{
  font-size:24px;
  font-weight:800;
  margin-top:4px;
}

.chart{
  height:260px;
  display:flex;
  align-items:flex-end;
  gap:10px;
  padding:15px 8px 0;
  border-bottom:1px solid var(--border);
}

.chart-day{
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  gap:6px;
  min-width:35px;
}

.chart-bar-wrap{
  width:100%;
  height:210px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.chart-bar{
  width:min(55px,80%);
  min-height:2px;
  background:var(--accent);
  border-radius:6px 6px 0 0;
}

.chart-hours{
  font-size:10px;
  color:var(--muted);
}

.chart-label{
  font-size:11px;
  font-weight:700;
}

/* ============================================================
   POMODORO
   ============================================================ */

.pomodoro{
  text-align:center;
}

.timer{
  font-size:52px;
  font-weight:800;
  letter-spacing:2px;
  margin:15px 0;
}

.pomodoro-actions{
  display:flex;
  justify-content:center;
  gap:7px;
  flex-wrap:wrap;
}

.pomo-presets{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-bottom:10px;
}

.pomo-presets button{
  border:1px solid var(--border);
  background:white;
  border-radius:8px;
  padding:7px 12px;
  font-weight:700;
}

.custom-duration{
  max-width:200px;
  margin:0 auto 10px;
}

/* ============================================================
   POPOVER
   ============================================================ */

.pop{
  position:fixed;
  z-index:10000;
  background:white;
  border:1px solid var(--border);
  box-shadow:0 18px 50px rgba(0,0,0,.18);
  border-radius:13px;
  padding:13px;
  width:min(380px,calc(100vw - 20px));
}

.pop h3{
  margin:0 0 10px;
  font-size:15px;
}

.pop-actions{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.pop button{
  width:100%;
  text-align:left;
  border:1px solid var(--border);
  background:white;
  border-radius:8px;
  padding:9px;
}

.pop button:hover{
  background:#f5f5f5;
}

.pop-close{
  margin-top:8px;
  color:var(--muted);
}

.pop-list{
  max-height:330px;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.pop-item{
  border:1px solid var(--border);
  border-radius:9px;
  padding:9px;
  cursor:pointer;
}

.pop-item:hover{
  background:#f7f7f7;
}

.pop-item-title{
  font-weight:800;
}

.pop-item-sub{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

/* ============================================================
   RESPONSIVE
   ============================================================ */

@media(max-width:1000px){
  .grid3{
    grid-template-columns:1fr;
  }

  .todo-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}

@media(max-width:750px){
  .app{
    width:min(100% - 16px,1500px);
    padding-top:10px;
  }

  .topbar{
    align-items:flex-start;
    flex-direction:column;
  }

  .grid2{
    grid-template-columns:1fr;
  }

  .form-row,
  .form-row.three{
    grid-template-columns:1fr;
  }

  .stats-cards{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .todo-grid{
    grid-template-columns:1fr;
  }

  .todo-day{
    min-height:auto;
  }

  .cal-wrap{
    min-width:780px;
  }

  .timer{
    font-size:42px;
  }
}

@media(max-width:500px){
  .card{
    padding:13px;
  }

  .stats-cards{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="app">

  <header>
    <div class="topbar">
      <div class="brand">
        <div class="brand-icon">✓</div>
        <div>
          <h1>Planning Révision</h1>
          <p>Ton espace de travail PASS</p>
        </div>
      </div>

      <div class="top-actions">
        <button class="btn" id="themeBtn">Thème</button>
        <button class="btn" id="exportBtn">Exporter</button>
        <button class="btn" id="importBtn">Importer</button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </div>
    </div>
  </header>

  <section class="greeting">
    <h2 id="greetingTitle">Bonjour 👋</h2>
    <p id="greetingText">Prêt à travailler ?</p>

    <div class="quote-actions">
      <div class="quote" id="quoteText"></div>
      <button class="quote-refresh" id="quoteRefresh" title="Nouvelle citation">↻</button>
    </div>
  </section>

  <!-- Les fonctionnalités sont générées par planning-enhancements.js -->

  <main id="appContent"></main>

</div>

<script src="/Planning-Revision/planning-enhancements.js?v=6"></script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/Planning-Revision/service-worker.js')
      .catch(error => console.error('Service Worker:', error));
  });
}
</script>

</body>
</html>
